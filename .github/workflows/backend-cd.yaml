deploy:
  name: Deploy Backend to EKS
  runs-on: ubuntu-latest

  needs:
    - build

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig \
          --region "${AWS_REGION}" \
          --name "${EKS_CLUSTER_NAME}"

    - name: Verify cluster access
      run: kubectl get nodes

    - name: Update Kubernetes image
      working-directory: starter/backend/k8s
      run: |
        kustomize edit set image \
          backend="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

    - name: Deploy Kubernetes manifests
      working-directory: starter/backend/k8s
      run: |
        kustomize build . | kubectl apply -f -

    - name: Verify rollout
      run: |
        kubectl rollout status deployment/backend --timeout=600s
      continue-on-error: true  # Don't fail immediately, get diagnostics first

    - name: Debug deployment status
      if: failure()
      run: |
        echo "=== Deployment Status ==="
        kubectl get deployment backend -o wide
        echo ""
        echo "=== Pod Status ==="
        kubectl get pods -l app=backend -o wide
        echo ""
        echo "=== Pod Events ==="
        kubectl describe pods -l app=backend
        echo ""
        echo "=== Pod Logs ==="
        kubectl logs -l app=backend --tail=50 --all-containers=true
