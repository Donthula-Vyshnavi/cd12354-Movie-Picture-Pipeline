deploy:
  name: Deploy Backend to EKS
  runs-on: ubuntu-latest

  needs:
    - build

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig \
          --region "${AWS_REGION}" \
          --name "${EKS_CLUSTER_NAME}"

    - name: Verify cluster access
      run: kubectl get nodes

    - name: Update Kubernetes image
      working-directory: starter/backend/k8s
      run: |
        kustomize edit set image \
          backend="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

    - name: Deploy Kubernetes manifests
      working-directory: starter/backend/k8s
      run: |
        kustomize build . | kubectl apply -f -

    - name: Wait for rollout with debugging
      run: |
        echo "Waiting for deployment to rollout..."
        if ! kubectl rollout status deployment/backend --timeout=600s; then
          echo ""
          echo "❌ Rollout timed out. Collecting diagnostics..."
          echo ""
          echo "=== DEPLOYMENT STATUS ==="
          kubectl get deployment backend -o wide
          echo ""
          echo "=== POD STATUS ==="
          kubectl get pods -l app=backend -o wide
          echo ""
          echo "=== POD DESCRIPTIONS ==="
          kubectl describe pods -l app=backend
          echo ""
          echo "=== AVAILABLE NODES AND CAPACITY ==="
          kubectl describe nodes | grep -A 5 "Allocated resources"
          echo ""
          echo "=== RECENT EVENTS ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -20
          echo ""
          echo "=== POD LOGS (Backend Container) ==="
          kubectl logs -l app=backend --tail=100 --all-containers=true 2>/dev/null || echo "No logs available yet"
          exit 1
        fi
