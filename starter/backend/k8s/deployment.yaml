spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # Max new pods while old exist
      maxUnavailable: 0     # Keep at least 1 pod running
  template:
    spec:
      containers:
      - name: backend
        livenessProbe:
          initialDelaySeconds: 30  # Give app time to start
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
